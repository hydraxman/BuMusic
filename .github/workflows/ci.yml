name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: python -m pytest
      - name: Build
        run: python -m build
      - name: Clean wheel install and real transcription smoke test
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile
          import venv
          from pathlib import Path

          wheel = next(Path("dist").glob("bumusic-*.whl"))
          root = Path(tempfile.mkdtemp(prefix="bumusic-wheel-test-"))
          environment = root / "venv"
          venv.EnvBuilder(with_pip=True).create(environment)
          bin_dir = environment / ("Scripts" if os.name == "nt" else "bin")
          python = bin_dir / ("python.exe" if os.name == "nt" else "python")
          cli = bin_dir / ("bumusic.exe" if os.name == "nt" else "bumusic")
          subprocess.run([python, "-m", "pip", "install", str(wheel.resolve())], check=True)
          audio = root / "c-major.wav"
          output = root / "result"
          subprocess.run([sys.executable, "scripts/generate_demo.py", str(audio)], check=True)
          subprocess.run(
              [cli, "transcribe", str(audio), "--out", str(output), "--bpm", "120"],
              check=True,
          )
          expected = {
              "notes.json",
              "score.musicxml",
              "original-timing.mid",
              "score.svg",
              "reconstructed-original-timing.wav",
          }
          assert expected <= {path.name for path in output.iterdir()}
          PY
